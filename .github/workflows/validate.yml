name: Validate EDW migration bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install pyyaml jsonschema shellcheck-py sqlfluff
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Guardrails (no offline / no converted divert)
        run: |
          test ! -d databricks/offline
          test ! -d databricks/converted
          ! grep -R "demo-offline" Makefile || exit 1
          ! grep -R "compose with Lakebridge\|shell out to Lakebridge" docs/lakebridge.md || exit 1

      - name: No WWI object names in core engine (uc + slugify + stage prompts)
        run: |
          if grep -En "Dimension\.Customer|MigrateStagedCustomerData|Fact\.Sale" \
              databricks/uc/*.sql agents/tools/slugify.py \
              agents/prompts/00_coordinator.md agents/prompts/01_assess.md \
              agents/prompts/02_convert.md agents/prompts/03_test.md \
              agents/prompts/04_gate.md; then
            echo "WWI-specific names found in core engine paths" >&2
            exit 1
          fi
          echo "core engine naming OK"

      - name: Core prompts branch on SOURCE_TYPE (not SQLSERVER-only forever)
        run: |
          grep -q "SOURCE_TYPE" agents/prompts/00_coordinator.md
          grep -q "mysql" agents/prompts/00_coordinator.md
          grep -q "mysql" agents/prompts/convert_style.md
          grep -q "routines_skipped_reason" agents/prompts/04_gate.md
          grep -qE "TYPE MYSQL|SOURCE_TYPE" agents/tools/render_sql.sh
          echo "SOURCE_TYPE dual-track guards OK"

      - name: Parse YAML / JSON
        run: |
          python3 - <<'PY'
          import json, yaml, pathlib
          root = pathlib.Path(".")
          for p in [
            "databricks.yml",
            "databricks/jobs/edw_migration_medallion.yml",
            "databricks/jobs/dashboard.yml",
            ".cursor/hooks.json",
            "databricks/dashboards/agent_events.lvdash.json",
            "legacy/fixtures/expectations.json",
            "agents/contracts/context.schema.json",
            "agents/samples/run/migration_manifest.json",
            "agents/samples/run/context.json",
          ]:
            path = root / p
            text = path.read_text()
            if path.suffix in {".yml", ".yaml"}:
              yaml.safe_load(text)
            else:
              json.loads(text)
            print("OK", p)
          PY

      - name: Validate sample artifacts against JSON contracts
        run: |
          python3 - <<'PY'
          import json
          from jsonschema import Draft7Validator
          pairs = [
            ("agents/contracts/context.schema.json", "agents/samples/run/context.json"),
            ("agents/contracts/migration_backlog.schema.json", "agents/samples/run/migration_backlog.json"),
            ("agents/contracts/migration_manifest.schema.json", "agents/samples/run/migration_manifest.json"),
            ("agents/contracts/reconcile_report.schema.json", "agents/samples/run/reconcile_report.json"),
          ]
          failed = False
          for schema_path, doc_path in pairs:
              schema = json.load(open(schema_path))
              Draft7Validator.check_schema(schema)
              doc = json.load(open(doc_path))
              errors = list(Draft7Validator(schema).iter_errors(doc))
              for e in errors:
                  print(f"FAIL {doc_path}: {e.message}")
                  failed = True
              if not errors:
                  print(f"OK   {doc_path}")
          raise SystemExit(1 if failed else 0)
          PY

      - name: Shell syntax + ShellCheck
        run: |
          find agents infra legacy databricks/genie -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find agents infra legacy databricks/genie -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Render + SQL lint (sqlserver + mysql)
        env:
          DATABRICKS_CATALOG: edw_migration
        run: |
          chmod +x agents/tools/*.sh
          SOURCE_TYPE=sqlserver AZ_SQL_SERVER=example AZ_SQL_ADMIN=edwadmin AZ_SQL_DB=WideWorldImportersDW \
            FOREIGN_CATALOG=wwi_dw_fed CONNECTION_NAME=azure_sql_edw \
            ./agents/tools/render_sql.sh
          grep -q "TYPE SQLSERVER" databricks/_rendered/uc/01_federation_setup.sql
          grep -q "source-password" databricks/_rendered/uc/01_federation_setup.sql
          sqlfluff lint databricks/_rendered/uc databricks/_rendered/silver databricks/_rendered/gold --nocolor || sqlfluff lint databricks/uc --nocolor
          SOURCE_TYPE=mysql SOURCE_HOST=example.mysql.database.azure.com SOURCE_PORT=3306 \
            SOURCE_DATABASE=appdb SOURCE_USER=demo SOURCE_PASSWORD=dummy \
            FOREIGN_CATALOG=wwi_dw_fed CONNECTION_NAME=azure_sql_edw DATABRICKS_CATALOG=my_edw \
            ./agents/tools/render_sql.sh
          grep -q "TYPE MYSQL" databricks/_rendered/uc/01_federation_setup.sql
          grep -q "example.mysql.database.azure.com" databricks/_rendered/uc/01_federation_setup.sql
          grep -q "mysql_fed" databricks/_rendered/uc/01_federation_setup.sql
          grep -q "azure_mysql_edw" databricks/_rendered/uc/01_federation_setup.sql
          grep -q "trustServerCertificate" databricks/_rendered/uc/01_federation_setup.sql
          echo "dual-source render OK"

      - name: Land source_system + context schema
        run: |
          python3 - <<'PY'
          import json, sys, tempfile
          from pathlib import Path
          from jsonschema import Draft7Validator
          sys.path.insert(0, "agents/tools")
          from generate_from_inventory import emit_land
          sql = emit_land(
              [{"source_schema":"dbo","source_name":"T","landing_name":"dbo_t","skip":False}],
              "c", "f", "mysql",
          )
          assert "'mysql' AS _source_system" in sql, sql
          schema = json.load(open("agents/contracts/context.schema.json"))
          doc = json.load(open("agents/samples/run/context.json"))
          Draft7Validator(schema).validate(doc)
          print("land + context schema OK")
          PY

      - name: Sync prompts smoke
        run: |
          ./agents/tools/sync_prompts.sh
          test -f .cursor/agents/edw-demo-guide.md
          test -f agents/github-copilot/edw-coordinator.md

      - name: Slugify unit check
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "agents/tools")
          from slugify import slugify_ident
          assert slugify_ident("Dimension", "Customer") == "dim_customer"
          assert slugify_ident("Fact", "Stock Holding") == "fact_stock_holding"
          assert slugify_ident("dbo", "Orders") == "dbo_orders"
          print("slugify OK")
          PY

      - name: Bundle validate (structure)
        env:
          BUNDLE_VAR_warehouse_id: "0000000000000000"
          BUNDLE_VAR_catalog: "edw_migration"
          DATABRICKS_CATALOG: edw_migration
          SOURCE_TYPE: sqlserver
          AZ_SQL_SERVER: example
          AZ_SQL_ADMIN: edwadmin
          AZ_SQL_DB: WideWorldImportersDW
        run: |
          ./agents/tools/render_sql.sh
          if databricks bundle validate --strict -t dev; then
            echo "bundle validate OK"
          else
            echo "bundle validate soft-fail without workspace auth"
          fi
