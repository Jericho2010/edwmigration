# AI/BI Control Plane dashboard — deploys with the bundle.
# Requires Databricks CLI >= 0.281.0 for dataset_catalog / dataset_schema.

resources:
  dashboards:
    agent_events:
      display_name: "[${bundle.target}] EDW Migration Control Plane"
      file_path: ../dashboards/agent_events.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ops
      permissions:
        - level: CAN_RUN
          group_name: users
