# DAB job: medallion pipeline.
# Paths are relative to THIS file (databricks/jobs/) — see AI Dev Kit databricks-bundles Path Resolution.
# Free Edition: max 5 concurrent tasks; peak fan-out here stays under 5.

resources:
  jobs:
    edw_migration_medallion:
      name: "[${bundle.target}] edw_migration_medallion"
      description: "EDW migration demo: federation smoke → bronze → silver → gold → reconcile"
      tags:
        demo: edw-migration
        edition: free
      max_concurrent_runs: 1
      timeout_seconds: 7200
      email_notifications:
        on_failure: []
      tasks:
        - task_key: federation_smoke
          timeout_seconds: 900
          sql_task:
            file:
              path: ../uc/02_federation_smoke.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_dims
          depends_on:
            - task_key: federation_smoke
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../bronze/10_land_dims.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_facts
          depends_on:
            - task_key: federation_smoke
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../bronze/11_land_facts.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_dims
          depends_on:
            - task_key: bronze_dims
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../silver/20_dims_scd1.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_customer_scd2
          depends_on:
            - task_key: bronze_dims
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../silver/21_dim_customer_scd2.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_fact_sale
          depends_on:
            - task_key: bronze_facts
            - task_key: silver_dims
            - task_key: silver_customer_scd2
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../silver/22_fact_sale.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_daily_sales
          depends_on:
            - task_key: silver_fact_sale
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../gold/30_mart_daily_sales.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_stock_movements
          depends_on:
            - task_key: silver_dims
            - task_key: bronze_facts
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../gold/31_mart_stock_movements.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_customer_current
          depends_on:
            - task_key: silver_customer_scd2
            - task_key: silver_dims
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../gold/32_mart_customer_current.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_city_dimension
          depends_on:
            - task_key: silver_dims
          timeout_seconds: 900
          sql_task:
            file:
              path: ../gold/33_mart_city_dimension.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: reconcile
          depends_on:
            - task_key: gold_daily_sales
            - task_key: gold_stock_movements
            - task_key: gold_customer_current
            - task_key: gold_city_dimension
          timeout_seconds: 900
          sql_task:
            file:
              path: ../tests/reconcile.sql
            warehouse_id: ${var.warehouse_id}

      permissions:
        - level: CAN_VIEW
          group_name: users
