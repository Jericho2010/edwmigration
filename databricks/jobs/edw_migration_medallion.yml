# DAB job resource: sequential medallion pipeline.
# Free Edition: max 5 concurrent tasks — sequential is safe.
# Each task is a SQL file run on the serverless SQL warehouse.

resources:
  jobs:
    edw_migration_medallion:
      name: edw_migration_medallion
      description: "EDW migration demo: federation smoke → bronze → silver → gold → reconcile"
      tags:
        demo: edw-migration
        edition: free
      tasks:
        - task_key: federation_smoke
          sql_task:
            file:
              path: databricks/uc/02_federation_smoke.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_dims
          depends_on:
            - task_key: federation_smoke
          sql_task:
            file:
              path: databricks/bronze/10_land_dims.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_facts
          depends_on:
            - task_key: federation_smoke
          sql_task:
            file:
              path: databricks/bronze/11_land_facts.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_dims
          depends_on:
            - task_key: bronze_dims
          sql_task:
            file:
              path: databricks/silver/20_dims_scd1.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_customer_scd2
          depends_on:
            - task_key: bronze_dims
          sql_task:
            file:
              path: databricks/silver/21_dim_customer_scd2.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_fact_sale
          depends_on:
            - task_key: bronze_facts
            - task_key: silver_dims
            - task_key: silver_customer_scd2
          sql_task:
            file:
              path: databricks/silver/22_fact_sale.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_daily_sales
          depends_on:
            - task_key: silver_fact_sale
          sql_task:
            file:
              path: databricks/gold/30_mart_daily_sales.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_stock_movements
          depends_on:
            - task_key: silver_dims
            - task_key: bronze_facts
          sql_task:
            file:
              path: databricks/gold/31_mart_stock_movements.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_customer_current
          depends_on:
            - task_key: silver_customer_scd2
            - task_key: silver_dims
          sql_task:
            file:
              path: databricks/gold/32_mart_customer_current.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_city_dimension
          depends_on:
            - task_key: silver_dims
          sql_task:
            file:
              path: databricks/gold/33_mart_city_dimension.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: reconcile
          depends_on:
            - task_key: gold_daily_sales
            - task_key: gold_stock_movements
            - task_key: gold_customer_current
            - task_key: gold_city_dimension
          sql_task:
            file:
              path: databricks/tests/reconcile.sql
            warehouse_id: ${var.warehouse_id}
