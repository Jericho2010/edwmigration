# DAB job: discovery-driven medallion pipeline.
# Paths relative to THIS file. SQL under ../_rendered/ after make render.
# Free Edition: max 5 concurrent job tasks.

resources:
  jobs:
    edw_migration_medallion:
      name: "[${bundle.target}] edw_migration_medallion"
      description: "EDW migration: smoke → bronze land (generated) → silver/gold → reconcile → lineage"
      tags:
        demo: edw-migration
        edition: free
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tasks:
        - task_key: federation_smoke
          timeout_seconds: 900
          sql_task:
            file:
              path: ../_rendered/uc/02_federation_smoke.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_land
          depends_on:
            - task_key: federation_smoke
          timeout_seconds: 3600
          sql_task:
            file:
              path: ../_rendered/bronze/10_land_all.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_dims
          depends_on:
            - task_key: bronze_land
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/silver/20_dims_scd1.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_customer_scd2
          depends_on:
            - task_key: bronze_land
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/silver/21_dim_customer_scd2.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_fact_sale
          depends_on:
            - task_key: bronze_land
            - task_key: silver_dims
            - task_key: silver_customer_scd2
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/silver/22_fact_sale.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_daily_sales
          depends_on:
            - task_key: silver_fact_sale
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/gold/30_mart_daily_sales.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_stock_movements
          depends_on:
            - task_key: silver_dims
            - task_key: bronze_land
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/gold/31_mart_stock_movements.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_customer_current
          depends_on:
            - task_key: silver_customer_scd2
            - task_key: silver_dims
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/gold/32_mart_customer_current.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_city_dimension
          depends_on:
            - task_key: silver_dims
          timeout_seconds: 900
          sql_task:
            file:
              path: ../_rendered/gold/33_mart_city_dimension.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_stock_holding
          depends_on:
            - task_key: bronze_land
            - task_key: silver_dims
          timeout_seconds: 900
          sql_task:
            file:
              path: ../_rendered/gold/35_mart_stock_holding.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: metric_daily_sales
          depends_on:
            - task_key: silver_fact_sale
          timeout_seconds: 900
          sql_task:
            file:
              path: ../_rendered/gold/34_metric_daily_sales.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: stage_fixtures
          depends_on:
            - task_key: federation_smoke
          timeout_seconds: 600
          sql_task:
            file:
              path: ../_rendered/tests/13_stage_fixture_expectations.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_24_migrate_city
          depends_on:
            - task_key: gold_daily_sales
            - task_key: gold_stock_movements
            - task_key: gold_customer_current
            - task_key: gold_city_dimension
            - task_key: gold_stock_holding
            - task_key: stage_fixtures
            - task_key: metric_daily_sales
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/silver/24_migrate_city.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_25_migrate_customer
          depends_on:
            - task_key: silver_24_migrate_city
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/silver/25_migrate_customer.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_26_migrate_employee
          depends_on:
            - task_key: silver_25_migrate_customer
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/silver/26_migrate_employee.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_27_migrate_stock_item
          depends_on:
            - task_key: silver_26_migrate_employee
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/silver/27_migrate_stock_item.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_28_migrate_supplier
          depends_on:
            - task_key: silver_27_migrate_stock_item
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/silver/28_migrate_supplier.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_29_migrate_sale
          depends_on:
            - task_key: silver_28_migrate_supplier
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/silver/29_migrate_sale.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_36_migrate_order
          depends_on:
            - task_key: silver_29_migrate_sale
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/gold/36_migrate_order.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_37_migrate_movement
          depends_on:
            - task_key: gold_36_migrate_order
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/gold/37_migrate_movement.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_38_migrate_purchase
          depends_on:
            - task_key: gold_37_migrate_movement
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/gold/38_migrate_purchase.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_39_migrate_stock_holding
          depends_on:
            - task_key: gold_38_migrate_purchase
          timeout_seconds: 1800
          sql_task:
            file:
              path: ../_rendered/gold/39_migrate_stock_holding.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: reconcile
          depends_on:
            - task_key: gold_39_migrate_stock_holding
          timeout_seconds: 900
          sql_task:
            file:
              path: ../_rendered/tests/reconcile.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: lineage_check
          depends_on:
            - task_key: reconcile
          timeout_seconds: 600
          sql_task:
            file:
              path: ../_rendered/uc/04_lineage_check.sql
            warehouse_id: ${var.warehouse_id}

      permissions:
        - level: CAN_VIEW
          group_name: users
