# DAB job: discovery-driven medallion pipeline (engine skeleton).
# Convert silver/gold tasks are inserted by check_job_wiring.py --apply.
# Paths relative to THIS file. SQL under ../_rendered/ after make render.
# Free Edition: max 5 concurrent job tasks.
#
# Restore this file from edw_migration_medallion.skeleton.yml on reset-sink.

resources:
  jobs:
    edw_migration_medallion:
      name: "[${bundle.target}] edw_migration_medallion"
      description: "EDW migration: smoke → bronze land (generated) → convert (wired) → reconcile → lineage"
      tags:
        demo: edw-migration
        edition: free
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tasks:
        - task_key: federation_smoke
          timeout_seconds: 900
          sql_task:
            file:
              path: ../_rendered/uc/02_federation_smoke.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: bronze_land
          depends_on:
            - task_key: federation_smoke
          timeout_seconds: 3600
          sql_task:
            file:
              path: ../_rendered/bronze/10_land_all.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: stage_fixtures
          depends_on:
            - task_key: federation_smoke
          timeout_seconds: 600
          sql_task:
            file:
              path: ../_rendered/tests/13_stage_fixture_expectations.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: reconcile
          depends_on:
            - task_key: bronze_land
          timeout_seconds: 900
          sql_task:
            file:
              path: ../_rendered/tests/reconcile.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: lineage_check
          depends_on:
            - task_key: reconcile
          timeout_seconds: 600
          sql_task:
            file:
              path: ../_rendered/uc/04_lineage_check.sql
            warehouse_id: ${var.warehouse_id}

      permissions:
        - level: CAN_VIEW
          group_name: users
